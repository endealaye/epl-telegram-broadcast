name: EPL Live Polling

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# actions: write lets the default GITHUB_TOKEN dispatch broadcast.yml
# (workflow_dispatch is one of the events GITHUB_TOKEN may trigger).
permissions:
  contents: read
  actions: write

# One run at a time so overlapping runs can't post the same item twice.
concurrency:
  group: epl-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ["TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "TELEGRAM_ADMIN_ID", "SUPABASE_URL", "SUPABASE_KEY"]
          missing = [k for k in required if not (os.getenv(k) or "").strip()]
          if missing:
              print(f"Missing required secrets: {', '.join(missing)}")
              sys.exit(1)
          print("Secrets validation passed.")
          PY

      - name: Process Live Updates
        id: live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JSON_URL: ${{ secrets.JSON_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
        run: python3 telegram_broadcast.py live

      # A final score was just sent: run the results broadcast now instead of
      # waiting up to 10 minutes for the broadcast.yml cron. That workflow's
      # concurrency group (epl-broadcast) queues this behind any run in flight.
      - name: Trigger results broadcast
        if: steps.live.outputs.finalized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run broadcast.yml --ref "${{ github.event.repository.default_branch }}" -f command=results
