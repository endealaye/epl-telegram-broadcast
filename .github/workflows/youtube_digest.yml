name: YouTube Digest (manual)

# Category merged videos are built after every news run (see
# news_translator.process_automated_news and youtube_digest.build_and_send_category_videos).
# This workflow is manual only: it merges everything broadcast since the last
# manual/digest run, regardless of category, and does not stamp video_batch_id.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Where to send the merged video'
        required: true
        type: choice
        default: 'telegram-digest'
        options:
          - 'telegram-digest'
          - 'youtube-digest'

# Shares the broadcast lock so the digest never overlaps a news run.
concurrency:
  group: epl-broadcast
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build and upload digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          MERGED_VIDEO_CHAT_ID: ${{ vars.MERGED_VIDEO_CHAT_ID }}
          DIGEST_MODE: ${{ inputs.mode }}
        run: python3 telegram_broadcast.py "$DIGEST_MODE"
